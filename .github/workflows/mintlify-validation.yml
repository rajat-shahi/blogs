name: Mintlify validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Mintlify site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate the Mintlify build
        run: npx --yes mint@4.2.680 validate

      - name: Check links
        run: npx --yes mint@4.2.680 broken-links
